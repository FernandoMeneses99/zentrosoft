<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="0.55" stop-color="#0d1d33"/>
      <stop offset="1" stop-color="#13223a"/>
    </linearGradient>
    <radialGradient id="glowB1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4b82c3" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#4b82c3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowG1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fd290" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4fd290" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardStroke1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b82c3" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#4fd290" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="grid1" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#4b82c3" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg1)"/>
  <rect width="1920" height="1080" fill="url(#grid1)"/>

  <ellipse cx="1420" cy="260" rx="660" ry="480" fill="url(#glowB1)"/>
  <ellipse cx="1150" cy="880" rx="540" ry="400" fill="url(#glowG1)"/>

  <!-- Browser window with landing layout -->
  <g opacity="0.95">
    <rect x="1140" y="230" width="620" height="430" rx="18" fill="#101f37" stroke="url(#cardStroke1)" stroke-width="2"/>
    <line x1="1140" y1="288" x2="1760" y2="288" stroke="#4b82c3" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="1176" cy="259" r="7" fill="#4fd290" fill-opacity="0.9"/>
    <circle cx="1202" cy="259" r="7" fill="#4b82c3" fill-opacity="0.9"/>
    <circle cx="1228" cy="259" r="7" fill="#94a3b8" fill-opacity="0.6"/>

    <!-- hero block -->
    <rect x="1180" y="330" width="300" height="26" rx="13" fill="#94a3b8" fill-opacity="0.55"/>
    <rect x="1180" y="374" width="220" height="26" rx="13" fill="#94a3b8" fill-opacity="0.35"/>
    <rect x="1180" y="420" width="150" height="42" rx="21" fill="#4fd290" fill-opacity="0.88"/>
    <rect x="1212" y="436" width="86" height="10" rx="5" fill="#0a1628" fill-opacity="0.55"/>

    <!-- chart card -->
    <rect x="1520" y="330" width="200" height="180" rx="14" fill="#0a1628" fill-opacity="0.65" stroke="#4b82c3" stroke-opacity="0.35" stroke-width="1.5"/>
    <polyline points="1544,472 1584,444 1614,456 1652,408 1694,392" stroke="#4fd290" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- content rows -->
    <rect x="1180" y="492" width="130 " height="52" rx="12" fill="#4b82c3" fill-opacity="0.35"/>
    <rect x="1330" y="492" width="130" height="52" rx="12" fill="#4b82c3" fill-opacity="0.28"/>
    <rect x="1480" y="492" width="240" height="52" rx="12" fill="#4b82c3" fill-opacity="0.2"/>

    <rect x="1180" y="586" width="280" height="14" rx="7" fill="#94a3b8" fill-opacity="0.3"/>
    <rect x="1180" y="618" width="200" height="14" rx="7" fill="#94a3b8" fill-opacity="0.22"/>
  </g>

  <!-- Floating conversion card -->
  <g opacity="0.9">
    <rect x="1010" y="700" width="270" height="170" rx="16" fill="#101f37" stroke="#4fd290" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="1062" cy="752" r="24" fill="#4fd290" fill-opacity="0.85"/>
    <polyline points="1050,752 1060,762 1078,742" stroke="#0a1628" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1102" y="738" width="140" height="12" rx="6" fill="#94a3b8" fill-opacity="0.55"/>
    <rect x="1102" y="762" width="104" height="10" rx="5" fill="#94a3b8" fill-opacity="0.3"/>
    <rect x="1040" y="806" width="210" height="34" rx="17" fill="#4b82c3" fill-opacity="0.45"/>
