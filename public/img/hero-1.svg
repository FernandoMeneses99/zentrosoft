  <g stroke="#4b82c3" stroke-opacity="0.12" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="420" y="740" width="160" height="110" rx="14"/>
    <line x1="420" y1="850" x2="500" y2="850"/>
    <line x1="500" y1="850" x2="500" y2="900"/>
  </g>
</svg>
