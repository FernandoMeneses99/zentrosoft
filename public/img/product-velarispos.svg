<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" fill="none">
  <defs>
    <linearGradient id="vpbg" x1="760" y1="0" x2="0" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#13223a"/>
    </linearGradient>
    <radialGradient id="vpglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fd290" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4fd290" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vpaccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fd290"/>
      <stop offset="1" stop-color="#4b82c3"/>
    </linearGradient>
    <pattern id="vpgrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#4b82c3" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="760" height="440" fill="url(#vpbg)"/>
  <rect width="760" height="440" fill="url(#vpgrid)"/>
  <ellipse cx="600" cy="80" rx="330" ry="240" fill="url(#vpglow)"/>

  <!-- POS terminal -->
  <g opacity="0.95">
    <rect x="430" y="90" width="230" height="280" rx="20" fill="#101f37" stroke="url(#vpaccent)" stroke-width="2"/>
    <rect x="456" y="118" width="178" height="110" rx="10" fill="#0a1628" stroke="#4b82c3" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="545" y="190" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="44" font-weight="800" fill="#4fd290">$</text>

    <!-- keypad -->
    <g fill="#4b82c3" fill-opacity="0.35">
      <rect x="456" y="248" width="50" height="34" rx="8"/><rect x="520" y="248" width="50" height="34" rx="8"/><rect x="584" y="248" width="50" height="34" rx="8"/>
      <rect x="456" y="292" width="50" height="34" rx="8"/><rect x="520" y="292" width="50" height="34" rx="8"/><rect x="584" y="292" width="50" height="34" rx="8"/>
    </g>
    <rect x="456" y="338" width="178" height="16" rx="8" fill="#94a3b8" fill-opacity="0.25"/>
  </g>

  <!-- Receipt -->
  <g opacity="0.9">
    <path d="M300 130 h150 v210 l-19 -14 -18 14 -18 -14 -18 14 -18 -14 -19 14 -18 -14 -18 14 z" transform="translate(2,0)" fill="#f8fafc"/>
    <g fill="#94a3b8">
      <rect x="322" y="152" width="106" height="9" rx="4.5"/>
      <rect x="322" y="174" width="76" height="8" rx="4"/>
      <rect x="322" y="192" width="92" height="8" rx="4"/>
      <rect x="322" y="226" width="106" height="6" rx="3"/>
      <rect x="322" y="242" width="84" height="8" rx="4"/>
      <rect x="322" y="260" width="98" height="8" rx="4"/>
      <rect x="322" y="290" width="70" height="12" rx="6"/>
    </g>
    <polyline points="322,318 340,308 356,316" stroke="#3bb876" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating stat chip -->
  <g opacity="0.9">
    <rect x="120" y="120" width="180 " height="120" rx="16" fill="#101f37" stroke="#4fd290" stroke-opacity="0.45" stroke-width="1.5"/>
    <polyline points="146,206 176,184 198,192 224,164 250,172 278,148" stroke="#4fd290" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="176" cy="184" r="6" fill="#4fd290"/>
    <circle cx="224" cy="164" r="6" fill="#4fd290"/>
  </g>

  <!-- Brand -->
  <text x="80" y="392" font-family="Inter, Arial, Helvetica, sans-serif" font-size="42" font-weight="800" letter-spacing="-1" fill="#ffffff">Velaris<tspan fill="#4fd290">POS</tspan></text>
</svg>
