<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" fill="none">
  <defs>
    <linearGradient id="zibg" x1="0" y1="0" x2="760" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#13223a"/>
    </linearGradient>
    <radialGradient id="ziglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4b82c3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4b82c3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ziaccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b82c3"/>
      <stop offset="1" stop-color="#4fd290"/>
    </linearGradient>
    <pattern id="zigrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#4b82c3" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="760" height="440" fill="url(#zibg)"/>
  <rect width="760" height="440" fill="url(#zigrid)"/>
  <ellipse cx="170" cy="90" rx="320" ry="230" fill="url(#ziglow)"/>

  <!-- Skyline -->
  <g fill="#101f37" stroke="#4b82c3" stroke-opacity="0.45" stroke-width="2">
    <rect x="430" y="150" width="90" height="210" rx="6"/>
    <rect x="536" y="100" width="110" height="260" rx="6"/>
    <rect x="662" y="190" width="70" height="170" rx="6"/>
  </g>
  <g fill="#4fd290" fill-opacity="0.75">
    <rect x="556" y="122" width="18" height="12" rx="3"/><rect x="586" y="122" width="18" height="12" rx="3"/><rect x="616" y="122" width="18" height="12" rx="3"/>
    <rect x="556" y="152" width="18" height="12" rx="3"/><rect x="616" y="152" width="18" height="12" rx="3"/>
    <rect x="556" y="182" width="18" height="12" rx="3"/><rect x="586" y="182" width="18" height="12" rx="3"/>
    <rect x="450" y="172" width="16" height="11" rx="3"/><rect x="480" y="172" width="16" height="11" rx="3"/>
    <rect x="450" y="202" width="16" height="11" rx="3"/><rect x="480" y="232" width="16" height="11" rx="3"/>
    <rect x="682" y="212" width="14" height="10" rx="3"/><rect x="704" y="242" width="14" height="10" rx="3"/>
  </g>

  <!-- Location pin over skyline -->
  <g>
    <path d="M590 40 c-26 0 -47 21 -47 47 c0 33 47 79 47 79 s47 -46 47 -79 c0 -26 -21 -47 -47 -47 z" fill="#4fd290"/>
    <circle cx="590" cy="86" r="19" fill="#0a1628"/>
    <polyline points="581,86 588,93 600,78" stroke="#4fd290" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Dashboard chip left -->
  <g opacity="0.92">
    <rect x="90" y="130" width="250" height="180" rx="16" fill="#101f37" stroke="url(#ziaccent)" stroke-width="2"/>
    <rect x="114" y="156" width="120" height="12" rx="6" fill="#94a3b8" fill-opacity="0.5"/>
    <rect x="114" y="184" width="90" height="52" rx="10" fill="#4b82c3" fill-opacity="0.4"/>
    <rect x="216" y="184" width="100" height="52" rx="10" fill="#4fd290" fill-opacity="0.35"/>
    <polyline points="114,292 148,272 178,280 214,254 250,262 292,238" stroke="#4fd290" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand -->
  <text x="80" y="392" font-family="Inter, Arial, Helvetica, sans-serif" font-size="42" font-weight="800" letter-spacing="-1" fill="#ffffff">Zentro <tspan fill="#4b82c3">Inmobiliaria</tspan></text>
</svg>
